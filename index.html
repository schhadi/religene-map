<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RELI-GENE — Transnational Field Sites &amp; Kinship Networks</title>

<!-- Leaflet (open source, no API key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Arrowheads / direction symbols -->
<script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<!-- RELI-GENE brand fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    /* RELI-GENE brand palette (from religene.eu) */
    --brand:#d8613c;        /* terracotta accent-3 */
    --ink:#111111;          /* contrast */
    --muted:#636363;        /* contrast-2 */
    --paper:#f9f9f9;
    --line:#e6e1d8; --tan:#c2a990;
    /* network colours — distinct hues, well-separated for quick reading */
    --c-palestine:#5b3fb5;  /* indigo-violet */
    --c-iraq:#e8702a;       /* orange       */
    --c-syria:#c42e6b;      /* raspberry    */
    --c-haredi:#1c8aa8;     /* teal         */
    --c-emirati:#4e9a3d;    /* green        */
    --c-jerusalem:#2f6db0;  /* blue — Israel + Palestine outline */
    --c-site:#3a352e;       /* neutral outline for other field-site countries */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}

  /* ---------- MAP (full-bleed) ---------- */
  #map{position:absolute;inset:0;height:100%;width:100%;background:#eef0f1;
       font-family:"Inter",system-ui,Arial,sans-serif;color:var(--ink)}
  .leaflet-tile-pane{filter:saturate(.9) sepia(.10) brightness(1.02)} /* warm, parchment tone */

  /* ---------- BRAND OVERLAY ---------- */
  #brand{
    position:absolute;top:14px;left:14px;z-index:1000;max-width:300px;
    background:rgba(249,249,249,.94);border:1px solid var(--line);border-radius:10px;
    padding:13px 16px;box-shadow:0 2px 12px rgba(0,0,0,.10);backdrop-filter:blur(2px);
  }
  #brand .name{font-family:"Cardo",Georgia,serif;font-weight:700;font-size:22px;line-height:1.05;margin:0}
  #brand .name .reli{color:var(--brand)}
  #brand .tag{font-size:11px;color:var(--muted);margin:6px 0 0;line-height:1.42}

  /* ---------- LEGEND / TOGGLES (Leaflet control) ---------- */
  .legend{
    background:rgba(249,249,249,.94);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;box-shadow:0 2px 12px rgba(0,0,0,.10);backdrop-filter:blur(2px);
    font:13px "Inter",system-ui,sans-serif;color:var(--ink);width:236px;max-width:84vw;
  }
  /* collapsible header */
  .legend .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none}
  .legend h4{margin:0;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
  .legend .chev{flex:0 0 auto;width:16px;height:16px;border:0;background:transparent;color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .25s ease;padding:0}
  .legend .chev svg{width:12px;height:12px}
  .legend .body{margin-top:8px;overflow:hidden}
  /* collapsed state: hide body, rotate chevron, shrink to a neat pill */
  .legend.collapsed{width:auto;min-width:0}
  .legend.collapsed .body{display:none}
  .legend.collapsed .chev{transform:rotate(-90deg)}
  .legend .row{display:flex;align-items:center;gap:9px;margin:6px 0;cursor:pointer;user-select:none}
  .legend input{margin:0;cursor:pointer;accent-color:var(--brand)}
  .legend .swatch{width:24px;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px;flex:0 0 auto}
  .legend .swatch.dashed{border-top-style:dotted;border-top-width:4px}
  .legend .swatch.area{height:13px;border:1.5px solid var(--c-site);background:rgba(58,53,46,.16);border-radius:3px}
  .legend .lbl{line-height:1.2;font-weight:600;font-size:12.5px}
  .legend .lbl small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:1px}
  .legend .hint{margin:9px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.45;font-weight:400}

  /* ---------- PLACE LABELS ---------- */
  .site-label{
    background:rgba(249,249,249,.82);border:1px solid var(--line);border-radius:5px;
    padding:1px 7px;font:600 11px "Inter";white-space:nowrap;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);
  }

  /* ---------- HOVER TOOLTIP CARD ---------- */
  .leaflet-tooltip.rg-tip{
    background:#fff;border:1px solid var(--line);border-radius:9px;
    box-shadow:0 4px 18px rgba(0,0,0,.17);padding:11px 14px;width:244px;max-width:78vw;white-space:normal;
    font-family:"Inter",system-ui,sans-serif;color:var(--ink);
  }
  .leaflet-tooltip.rg-tip:before{display:none}           /* drop the little arrow */
  .rg-tip .tk{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--brand)}
  .rg-tip .ttl{font-family:"Cardo",serif;font-size:18px;font-weight:700;margin:2px 0 5px;line-height:1.12}
  .rg-tip .tx{display:block;font-size:12px;line-height:1.5;color:#2a2a2a}
  .rg-tip .dir{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;color:#fff;border-radius:3px;padding:2px 8px}

  /* ---------- FOCUS / ISOLATE MODE ---------- */
  .leaflet-pane path{transition:opacity .45s ease, fill-opacity .45s ease, stroke-width .25s ease}
  .leaflet-marker-icon{transition:opacity .4s ease}
  .rg-dim{opacity:.10 !important}                                    /* faded context        */
  .rg-hide{opacity:0 !important;pointer-events:none}                 /* hidden, non-relevant */
  .rg-focus{fill-opacity:.30 !important;stroke-width:2.6 !important} /* the isolated country */
  #showall{
    position:absolute;left:14px;bottom:24px;z-index:1000;display:none;align-items:center;gap:7px;
    background:var(--brand);color:#fff;border:0;border-radius:8px;padding:9px 15px;
    font:600 12.5px "Inter",system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.20)
  }
  #showall:hover{filter:brightness(1.07)}

  /* ---------- animated flow ---------- */
  path.flow{animation:flowmove 1.05s linear infinite}
  @keyframes flowmove{to{stroke-dashoffset:-16}}
  @media (prefers-reduced-motion: reduce){ path.flow{animation:none}
    .leaflet-pane path,.leaflet-marker-icon{transition:none} }

  @media(max-width:720px){
    #brand{max-width:58vw;padding:8px 11px}
    #brand .name{font-size:16px}
    #brand .tag{display:none}              /* compact wordmark only */
    .legend{min-width:0;max-width:72vw;padding:8px 10px;font-size:11.5px}
    .legend .body{max-height:54vh;overflow-y:auto}   /* scroll instead of overflowing the map */
    .legend .lbl{font-size:11px}
    .legend .row{margin:8px 0}              /* bigger tap targets */
    .legend .hint{display:none}
    .leaflet-tooltip.rg-tip{width:200px;padding:9px 11px}
    .rg-tip .ttl{font-size:16px}
  }
</style>
</head>
<body>
  <div id="map"></div>
  <button id="showall" type="button">&#8634; Show all sites</button>
  <div id="brand">
    <p class="name"><span class="reli">RELI</span>-GENE</p>
    <p class="tag">Governing Health, Family &amp; Religion: the biopolitics of genetic counselling and religious family formations · SOAS, University of London · ERC 2025–2030</p>
  </div>

/* ============================================================
   BASE MAP — label-free tiles; we add our own place labels only
   ============================================================ */
const map = L.map('map',{zoomControl:true,scrollWheelZoom:true,minZoom:2})
  .setView([43,10],3.3);
map.zoomControl.setPosition('bottomright');
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap, &copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);

/* outlines live in their own pane, below the flow lines */
map.createPane('outlines');
map.getPane('outlines').style.zIndex = 350;

function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

/* ============================================================
   DATA
   ============================================================ */
const PLACES = {
  jerusalem:{ll:[31.7683,35.2137],name:'Jerusalem',type:'Field site',note:'Major hub for Palestinian communities of diverse ethno-religious backgrounds and for Haredi networks of kinship, reproductive screening and fertility treatment.'},
  germany:  {ll:[52.5200,13.4050],name:'Germany',  type:'Field site',note:'A major European hub for Palestinian, Syrian and Iraqi diaspora families — shaped by migration, asylum and family-reunification pathways, with enduring cross-border kinship ties.'},
  sweden:   {ll:[59.3293,18.0686],name:'Sweden',   type:'Field site',note:'A major European hub for Palestinian, Syrian and Iraqi diaspora communities — shaped by migration, asylum and family-reunification pathways, with enduring cross-border kinship ties.'},
  uae:      {ll:[24.4539,54.3773],name:'UAE',       type:'Field site',note:'Major hub for premarital genetic screening and fertility treatment in the Gulf.'},
  london:   {ll:[51.5074,-0.1278],name:'London',    type:'Field site',note:'Project based at SOAS; London is a hub for transnational kinship networks among close-knit ethno-religious communities.'},
  newyork:  {ll:[40.7128,-74.0060],name:'New York', type:'Field site',note:'A major hub in transnational Haredi kinship networks.'},
  iraq:     {ll:[33.3152,44.3661],name:'Iraq',      type:'Origin',    note:'War, persecution and forced displacement of Iraqis from diverse ethno-religious backgrounds.'},
  syria:    {ll:[33.5138,36.2765],name:'Syria',     type:'Origin',    note:'War, persecution and forced displacement of Syrians from diverse ethno-religious backgrounds.'},
};
const SITE_KEYS = ['jerusalem','germany','sweden','uae','london','newyork'];

const GROUPS = [
  {key:'palestine', label:'Palestinian diaspora', raw:getCss('--c-palestine'), directed:true,
   edges:[['jerusalem','germany'],['jerusalem','sweden']],
   desc:'Palestinian families who moved to Germany and Sweden, and the cross-border kinship ties they maintain.'},
  {key:'iraq',  label:'Iraqi diaspora',  raw:getCss('--c-iraq'), directed:true, origin:'iraq',
   edges:[['iraq','germany'],['iraq','sweden']],
   desc:'Iraqi minority families who migrated to Germany and Sweden, and the cross-border kinship ties they maintain.'},
  {key:'syria', label:'Syrian diaspora', raw:getCss('--c-syria'), directed:true, origin:'syria',
   edges:[['syria','germany'],['syria','sweden']],
   desc:'Syrian minority families who migrated to Germany and Sweden, and the cross-border kinship ties they maintain.'},
  {key:'haredi',label:'Jerusalem · London · New York', raw:getCss('--c-haredi'), directed:false,
   edges:[['jerusalem','london'],['london','newyork'],['jerusalem','newyork']],
   desc:'Key hubs connecting transnational Haredi kinship, marriage and communal networks. Ties run in both directions.'},
  {key:'emirati',label:'UAE · UK', raw:getCss('--c-emirati'), directed:false,
   edges:[['uae','london']],
   desc:'Bidirectional transnational links of Emiratis between the UAE and the UK.'},
];

/* ============================================================
   CURVED ARC — sampled quadratic Bézier with perpendicular bend
   ============================================================ */
function curve(a,b,bend=0.20,steps=64){
  const [y1,x1]=a,[y2,x2]=b, mx=(y1+y2)/2,my=(x1+x2)/2, dx=y2-y1,dy=x2-x1;
  const cy=mx-dy*bend, cx=my+dx*bend, pts=[];
  for(let i=0;i<=steps;i++){const t=i/steps,u=1-t;
    pts.push([u*u*y1+2*u*t*cy+t*t*y2, u*u*x1+2*u*t*cx+t*t*x2]);}
  return pts;
}

/* ============================================================
   HOVER TOOLTIP CONTENT
   ============================================================ */
function placeTip(k){
  const p=PLACES[k];
  return `<span class="tk">${p.type}</span><div class="ttl">${p.name}</div><span class="tx">${p.note}</span>`;
}
function edgeTip(g,fromK,toK){
  const f=PLACES[fromK],t=PLACES[toK];
  const arrow = g.directed ? `${f.name} &rarr; ${t.name}` : `${f.name} &harr; ${t.name}`;
  return `<span class="tk" style="color:${g.raw}">${g.directed?'Migration flow':'Kinship network'}</span>`+
         `<div class="ttl">${g.label}</div><span class="tx">${g.desc}</span>`+
         `<span class="dir" style="background:${g.raw}">${arrow}</span>`;
}
const TIP = {className:'rg-tip',sticky:true,opacity:1};

/* ============================================================
   COUNTRY-OUTLINE FACTORY (hover highlights + tooltip)
   ============================================================ */
function countryOutline(k,color,isSite){
  const geo = COUNTRIES[k];
  if(!geo) return null;
  const base = {pane:'outlines',color,weight:1.4,opacity:.9,fillColor:color,
                fillOpacity:isSite?.10:.15,lineJoin:'round'};
  return L.geoJSON({type:'Feature',geometry:geo},{
    pane:'outlines',
    style:base,
    onEachFeature:(f,layer)=>{
      layer.bindTooltip(placeTip(k),{...TIP,direction:'top'});
      layer.on('mouseover',()=>layer.setStyle({weight:2.4,fillOpacity:isSite?.26:.32}));
      layer.on('mouseout', ()=>layer.setStyle(base));
      layer.on('click',   ()=>{ eatClick(); focusPlace(k); });
    }
  });
}

/* always-on text label at the city anchor (no dot) */
function labelMarker(p){
  return L.marker(p.ll,{interactive:false,icon:L.divIcon({className:'',
    html:`<div class="site-label">${p.name}</div>`,iconAnchor:[-8,8]})});
}

/* ============================================================
   FIELD-SITE COUNTRIES (always-on layer)
   ============================================================ */
/* registries used by the click-to-isolate focus mode */
const DEFAULT_CENTER=[43,10], DEFAULT_ZOOM=3.3;
const outlineByKey={}, labelByKey={}, edges=[], groupEnabled={};
let currentFocus=null;

const SITE_COLORS={ jerusalem:getCss('--c-jerusalem'), uae:getCss('--c-emirati') };
const siteLayer=L.layerGroup();
SITE_KEYS.forEach(k=>{
  const o=countryOutline(k, SITE_COLORS[k]||getCss('--c-site'), true);
  if(o){ o.addTo(siteLayer); outlineByKey[k]=o; }
  const lbl=labelMarker(PLACES[k]); lbl.addTo(siteLayer); labelByKey[k]=lbl;
});
siteLayer.addTo(map);

/* ============================================================
   LINK GROUPS — base line + animated flow + arrowhead + origin country
   ============================================================ */
const groupLayers={};
GROUPS.forEach(g=>{
  groupEnabled[g.key]=true;
  const lg=L.layerGroup();
  // origin country outline first, so flow lines render on top of it
  if(g.origin){
    const o=countryOutline(g.origin,g.raw,false);
    if(o){ o.addTo(lg); outlineByKey[g.origin]=o; }
    const lbl=labelMarker(PLACES[g.origin]); lbl.addTo(lg); labelByKey[g.origin]=lbl;
  }
  g.edges.forEach(([fromK,toK])=>{
    const pts=curve(PLACES[fromK].ll,PLACES[toK].ll);
    const tip=edgeTip(g,fromK,toK);
    // faint base (wide, easy hover target)
    const baseLine=L.polyline(pts,{color:g.raw,weight:6,opacity:.20})
      .bindTooltip(tip,TIP).on('click',eatClick).addTo(lg);
    // animated flowing dots
    const flowLine=L.polyline(pts,{color:g.raw,weight:3,opacity:.95,lineCap:'round',
      dashArray:'2 14',className:'flow'})
      .bindTooltip(tip,TIP).on('click',eatClick).addTo(lg);
    // direction arrowhead (migration flows only) — added to the map by applyFx()
    const deco = g.directed ? L.polylineDecorator(pts,{patterns:[{offset:'100%',repeat:0,
        symbol:L.Symbol.arrowHead({pixelSize:11,polygon:true,pathOptions:{stroke:false,fillOpacity:1,color:g.raw}})}]}) : null;
    edges.push({from:fromK,to:toK,group:g.key,lines:[baseLine,flowLine],deco});
  });
  lg.addTo(map);
  groupLayers[g.key]=lg;
});

/* ============================================================
   LEGEND + LAYER TOGGLES (on-map control)
   ============================================================ */
const legend = L.control({position:'topright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','legend');
  const chevSvg = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  div.innerHTML =
    `<div class="hd" id="legend-hd" role="button" tabindex="0" aria-expanded="true" aria-controls="legend-body">`+
      `<h4>Layers</h4>`+
      `<button type="button" class="chev" aria-label="Collapse layers panel">${chevSvg}</button>`+
    `</div>`+
    `<div class="body" id="legend-body">`+
      `<label class="row"><input type="checkbox" id="t-sites" checked>`+
        `<span class="swatch area"></span>`+
        `<span class="lbl">Field sites<small>Country outlines</small></span></label>`+
      GROUPS.map(g=>`<label class="row">`+
        `<input type="checkbox" class="t-link" data-key="${g.key}" checked>`+
        `<span class="swatch${g.directed?'':' dashed'}" style="border-top-color:${g.raw}"></span>`+
        `<span class="lbl">${g.label}<small>${g.directed?'Migration flow (directional)':'Kinship network (bidirectional)'}</small></span>`+
      `</label>`).join('')+
      `<p class="hint"><b>Hover</b> for details · <b>click a country</b> to isolate its connections. Arrowheads show migration direction; dotted lines are bidirectional kinship ties.</p>`+
    `</div>`;
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  // collapse / expand
  const hd = div.querySelector('#legend-hd');
  const toggle = ()=>{
    const collapsed = div.classList.toggle('collapsed');
    hd.setAttribute('aria-expanded', String(!collapsed));
    div.querySelector('.chev').setAttribute('aria-label', collapsed?'Expand layers panel':'Collapse layers panel');
  };
  L.DomEvent.on(hd,'click',toggle);
  L.DomEvent.on(hd,'keydown',e=>{ if(e.key==='Enter'||e.key===' '){ L.DomEvent.preventDefault(e); toggle(); } });
  // start collapsed by default — user pops it open when needed
  div.classList.add('collapsed'); hd.setAttribute('aria-expanded','false');
  return div;
};
legend.addTo(map);

document.getElementById('t-sites').addEventListener('change',e=>{
  e.target.checked?map.addLayer(siteLayer):map.removeLayer(siteLayer);
  applyFx();
});
document.querySelectorAll('.t-link').forEach(cb=>cb.addEventListener('change',e=>{
  const key=e.target.dataset.key;
  groupEnabled[key]=e.target.checked;
  e.target.checked?map.addLayer(groupLayers[key]):map.removeLayer(groupLayers[key]);
  applyFx();
}));

/* ============================================================
   CLICK-TO-ISOLATE FOCUS MODE
   Click a country -> show only it and the flows touching it,
   fade the rest, and fly to fit. Click empty map / button /
   Esc / the same country again -> show everything.
   ============================================================ */
const FX=['rg-dim','rg-hide','rg-focus'];
function paintEl(el,cls){ if(!el) return; el.classList.remove(...FX); if(cls) el.classList.add(cls); }
function paint(layer,cls){
  if(!layer) return;
  if(layer.getElement){ paintEl(layer.getElement(),cls); }
  if(layer.eachLayer) layer.eachLayer(s=>paint(s,cls));
}

function applyFx(){
  const k=currentFocus;
  let relEdges=[]; const relPlaces=new Set();
  if(k){
    relEdges=edges.filter(e=>e.from===k||e.to===k);
    relPlaces.add(k); relEdges.forEach(e=>{relPlaces.add(e.from);relPlaces.add(e.to);});
  }
  // country outlines
  for(const key in outlineByKey)
    paint(outlineByKey[key], !k ? '' : (key===k ? 'rg-focus' : (relPlaces.has(key)?'':'rg-dim')));
  // place labels
  for(const key in labelByKey)
    paintEl(labelByKey[key].getElement(), (k && !relPlaces.has(key)) ? 'rg-dim' : '');
  // flow lines (CSS fade) + arrowheads (add/remove)
  edges.forEach(e=>{
    const on = !k || relEdges.indexOf(e)>=0;
    e.lines.forEach(p=>paint(p, on?'':'rg-hide'));
    if(e.deco){
      const want=on && groupEnabled[e.group], isOn=map.hasLayer(e.deco);
      if(want&&!isOn) e.deco.addTo(map); else if(!want&&isOn) map.removeLayer(e.deco);
    }
  });
}

const showAllBtn=document.getElementById('showall');
function focusPlace(k){
  if(!outlineByKey[k]) return;
  currentFocus = (currentFocus===k) ? null : k;
  applyFx();
  if(currentFocus){
    const rel=edges.filter(e=>e.from===k||e.to===k);
    const places=new Set([k]); rel.forEach(e=>{places.add(e.from);places.add(e.to);});
    const b=L.latLngBounds([]);
    places.forEach(key=>{ const o=outlineByKey[key];
      if(o&&map.hasLayer(o)){ try{ b.extend(o.getBounds()); }catch(_){} }
      b.extend(PLACES[key].ll); });
    rel.forEach(e=>{ try{ b.extend(e.lines[0].getBounds()); }catch(_){} });
    if(b.isValid()) map.flyToBounds(b,{paddingTopLeft:[40,135],paddingBottomRight:[40,55],duration:.9,maxZoom:6});
    showAllBtn.style.display='inline-flex';
  } else {
    map.flyTo(DEFAULT_CENTER,DEFAULT_ZOOM,{duration:.8});
    showAllBtn.style.display='none';
  }
}
function clearFocus(){ if(currentFocus!==null) focusPlace(currentFocus); }

/* swallow clicks on lines/countries so they don't bubble to the map's
   "click empty space = clear" handler */
let _eat=false;
function eatClick(){ _eat=true; setTimeout(()=>_eat=false,0); }
map.on('click',()=>{ if(!_eat) clearFocus(); });
showAllBtn.addEventListener('click',clearFocus);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') clearFocus(); });

applyFx();   // initial paint: adds the arrowheads for enabled groups
</script>
